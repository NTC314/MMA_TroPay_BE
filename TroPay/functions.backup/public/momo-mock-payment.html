<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock MoMo Payment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #A50064 0%, #D82D8B 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .logo {
      font-size: 48px;
      margin-bottom: 10px;
    }
    h1 {
      color: #A50064;
      font-size: 24px;
      margin-bottom: 10px;
    }
    .mock-badge {
      background: #FFC107;
      color: #000;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
    }
    .info {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .info-row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #666;
    }
    .value {
      color: #333;
      font-weight: 600;
    }
    .amount {
      font-size: 32px;
      color: #A50064;
      font-weight: bold;
      margin: 20px 0;
    }
    .button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin: 10px 0;
      transition: all 0.3s;
    }
    .button-success {
      background: #4CAF50;
      color: white;
    }
    .button-success:hover {
      background: #45a049;
      transform: translateY(-2px);
    }
    .button-fail {
      background: #F44336;
      color: white;
    }
    .button-fail:hover {
      background: #da190b;
      transform: translateY(-2px);
    }
    .note {
      font-size: 12px;
      color: #999;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">💰</div>
    <h1>Mock MoMo Payment</h1>
    <div class="mock-badge">🧪 TEST MODE</div>
    
    <div class="info">
      <div class="info-row">
        <span class="label">Mã đơn hàng:</span>
        <span class="value" id="orderId">...</span>
      </div>
      <div class="info-row">
        <span class="label">Mã yêu cầu:</span>
        <span class="value" id="requestId">...</span>
      </div>
    </div>
    
    <div class="amount" id="amount">0đ</div>
    
    <button class="button button-success" onclick="handlePaymentSuccess()">
      ✅ Thanh toán thành công
    </button>
    
    <button class="button button-fail" onclick="handlePaymentFail()">
      ❌ Thanh toán thất bại
    </button>
    
    <div class="note">
      💡 <strong>Lưu ý:</strong> Đây là môi trường test. 
      Chọn "Thành công" hoặc "Thất bại" để mô phỏng kết quả thanh toán.
    </div>
  </div>

  <script>
    // Get URL params
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId') || 'N/A';
    const requestId = urlParams.get('requestId') || 'N/A';
    const amount = urlParams.get('amount') || '0';

    // Display info
    document.getElementById('orderId').textContent = orderId;
    document.getElementById('requestId').textContent = requestId;
    document.getElementById('amount').textContent = parseInt(amount).toLocaleString('vi-VN') + 'đ';

    function handlePaymentSuccess() {
      console.log('✅ Mock payment success');
      
      // Simulate successful payment callback
      const callbackUrl = `/api/momo/callback?` + 
        `partnerCode=MOMO` +
        `&orderId=${encodeURIComponent(orderId)}` +
        `&requestId=${encodeURIComponent(requestId)}` +
        `&amount=${amount}` +
        `&orderInfo=Mock payment` +
        `&orderType=momo_wallet` +
        `&transId=MOCK_${Date.now()}` +
        `&resultCode=0` +
        `&message=Thành công` +
        `&payType=webApp` +
        `&responseTime=${Date.now()}` +
        `&extraData=` +
        `&signature=mock_signature`;
      
      window.location.href = callbackUrl;
    }

    function handlePaymentFail() {
      console.log('❌ Mock payment fail');
      
      // Simulate failed payment callback
      const callbackUrl = `/api/momo/callback?` +
        `partnerCode=MOMO` +
        `&orderId=${encodeURIComponent(orderId)}` +
        `&requestId=${encodeURIComponent(requestId)}` +
        `&amount=${amount}` +
        `&orderInfo=Mock payment` +
        `&orderType=momo_wallet` +
        `&transId=` +
        `&resultCode=1006` +
        `&message=Số dư không đủ` +
        `&payType=webApp` +
        `&responseTime=${Date.now()}` +
        `&extraData=` +
        `&signature=mock_signature`;
      
      window.location.href = callbackUrl;
    }
  </script>
</body>
</html>
